<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología Histórica Interactiva</title>
    
    <!-- Fuentes modernas (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos de Vis-Timeline -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* ============================
           Estética y Diseño Base
           ============================ */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 25px;
            font-weight: 600;
        }
        
        /* Contenedor de la línea de tiempo */
        #visualization {
            width: 100%;
            height: 80vh;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* Estilos personalizados para los elementos de Vis-Timeline */
        .vis-item {
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border-width: 2px !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .vis-item:hover {
            transform: scale(1.04) translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            z-index: 999 !important;
        }
        .vis-item-content {
            padding: 4px 8px;
            font-size: 16px;
        }
        .vis-group {
            font-weight: 600;
            font-size: 14px;
        }

        /* ============================
           Pop-up (Tooltip Interactivo)
           ============================ */
        #timeline-tooltip {
            position: absolute;
            display: none;
            width: 320px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            padding: 20px;
            z-index: 1000;
            border: 1px solid #eaeaea;
            font-size: 14px;
            pointer-events: auto; /* Permite interactuar con su contenido */
        }
        .tt-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .tt-first-sentence {
            margin: 0 0 15px 0;
            line-height: 1.6;
            color: #444;
        }
        .btn-more {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-more:hover {
            background-color: #2980b9;
        }
        .tt-full-content {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed #dcdcdc;
            padding-top: 15px;
            animation: fadeIn 0.3s ease;
        }
        .tt-full-text {
            margin: 0 0 15px 0;
            line-height: 1.6;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
        }
        .tt-meta {
            font-size: 12px;
            color: #7f8c8d;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
        }
        .tt-meta strong {
            color: #34495e;
        }
        
        /* Animación suave al desplegar */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Pantalla de carga */
        #loader {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Cronología Interactiva</h1>
    <div id="loader">Cargando datos desde CSV... <i class="fas fa-spinner fa-spin"></i></div>
    <div id="visualization" style="display:none;"></div>

    <!-- Contenedor del Pop-up Interactivo -->
    <div id="timeline-tooltip">
        <div class="tt-header">
            <i id="tt-icon" class="fas fa-circle"></i>
            <span id="tt-category">Categoría</span>
        </div>
        <p class="tt-first-sentence" id="tt-first-sentence"></p>
        <button class="btn-more" id="tt-btn-more">Ver más <i class="fas fa-chevron-down"></i></button>
        
        <!-- Contenido desplegable -->
        <div class="tt-full-content" id="tt-full-content">
            <p class="tt-full-text" id="tt-full-text"></p>
            <div class="tt-meta">
                <div><strong>Fuente:</strong> <span id="tt-fuente"></span></div>
                <div><strong>Página:</strong> <span id="tt-pag"></span></div>
            </div>
        </div>
    </div>

    <!-- Librerías de JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <script>
        // Archivo objetivo (debe estar en la misma ruta que el index.html en Github)
        const fileUrl = "CRONOLOGIAS FINAL.csv";
        
        // Paleta de colores modernos para las localidades (Eje Vertical)
        const colors = [
            "#4e79a7", "#f28e2c", "#e15759", "#76b7b2", "#59a14f", 
            "#edc949", "#af7aa1", "#ff9da7", "#9c755f", "#bab0ab",
            "#2c3e50", "#8e44ad", "#27ae60", "#d35400", "#c0392b"
        ];
        let colorMap = {};

        // Función para asignar colores únicos a cada Localidad
        function getColor(localidad) {
            if (!colorMap[localidad]) {
                colorMap[localidad] = colors[Object.keys(colorMap).length % colors.length];
            }
            return colorMap[localidad];
        }

        // Función para asignar iconos (FontAwesome) analizando las Categorías
        function getIcon(categoria) {
            const cat = (categoria || "").toLowerCase();
            if (cat.includes("transporte") || cat.includes("comunicacion")) return "fas fa-bus";
            if (cat.includes("energía") || cat.includes("energia")) return "fas fa-bolt";
            if (cat.includes("institución") || cat.includes("institucion")) return "fas fa-building";
            if (cat.includes("política") || cat.includes("politica")) return "fas fa-landmark";
            if (cat.includes("educación") || cat.includes("educacion")) return "fas fa-graduation-cap";
            if (cat.includes("salud")) return "fas fa-hospital";
            if (cat.includes("economía") || cat.includes("economia")) return "fas fa-chart-line";
            return "fas fa-calendar-check"; // Icono por defecto
        }

        // Función para extraer solo la primera oración del texto
        function getFirstSentence(text) {
            if (!text) return "";
            // Busca hasta encontrar el primer punto, signo de exclamación o interrogación
            let match = text.match(/(.*?[.!?])(?:\s|$)/);
            return match ? match[1] : text;
        }

        // Carga y parseo del CSV (Adaptado a codificación ISO-8859-1 para respetar tildes y ñ)
        fetch(fileUrl)
            .then(response => {
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                return response.arrayBuffer();
            })
            .then(buffer => {
                // Decodificar el texto con soporte al español
                let decoder = new TextDecoder('iso-8859-1'); 
                let csvText = decoder.decode(buffer);
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('visualization').style.display = 'block';
                        renderTimeline(results.data);
                    }
                });
            })
            .catch(err => {
                document.getElementById('loader').innerHTML = `<strong>Error:</strong> ${err.message}.<br>Verifica que el archivo 'CRONOLOGIAS FINAL.csv' esté subido en el mismo lugar que este index.html en GitHub.`;
            });

        let timeline;
        let itemsDataSet;

        function renderTimeline(data) {
            let groups = [];
            let items = [];
            let localidades = new Set();

            data.forEach((row, index) => {
                let year = (row.Año || "").trim();
                let loc = (row.Localidad || "").trim();
                let desc = (row.Descripción || "").trim();
                let cat = (row.Categoría || "").trim();
                let fuente = (row.Fuente || "").trim();
                let pag = (row.Pag || "").trim();

                if (!year || !loc) return;

                // 1. Conformar los Grupos (Eje Vertical) por Localidad
                if (!localidades.has(loc)) {
                    localidades.add(loc);
                    let color = getColor(loc);
                    groups.push({
                        id: loc,
                        content: `<span style="color:${color};">${loc}</span>`,
                        style: `background-color: ${color}08;` // Color de fondo muy tenue
                    });
                }

                // 2. Conformar Puntos y Barras
                let start, end = null, type = 'box';
                
                // Si es un periodo (ej: 1955-1960), se crea un Rango (Barra). Si no, un Punto (Línea)
                if (year.includes('-')) {
                    let parts = year.split('-');
                    start = parts[0].trim() + '-01-01';
                    end = parts[1].trim() + '-12-31';
                    type = 'range'; 
                } else {
                    start = year + '-01-01';
                    type = 'point'; 
                }

                let iconClass = getIcon(cat);
                let color = getColor(loc);
                
                items.push({
                    id: index,
                    group: loc,
                    start: start,
                    end: end,
                    type: type,
                    // Se inserta la iconografía dentro del elemento visual
                    content: `<div class="vis-item-content"><i class="${iconClass}"></i></div>`,
                    style: `border-color: ${color}; background-color: white; color: ${color};`,
                    customData: { // Guardamos la info para alimentar el pop-up luego
                        firstSentence: getFirstSentence(desc),
                        fullText: desc,
                        category: cat,
                        icon: iconClass,
                        source: fuente,
                        page: pag
                    }
                });
            });

            // Convertimos arreglos de objetos a Datasets propios de la librería
            itemsDataSet = new vis.DataSet(items);
            let groupsDataSet = new vis.DataSet(groups);

            let container = document.getElementById('visualization');
            
            // 3. Configuración Principal de Interacciones
            let options = {
                zoomable: true,          // Zoom con scroll de mouse activado
                moveable: true,          // Desplazamiento lateral activado
                orientation: 'top',      // Eje de años horizontal situado arriba
                stack: true,             // Evita que los recuadros se tapen entre sí
                margin: { item: 15, axis: 25 },
                tooltip: {
                    followMouse: false,  // Desactivamos el tooltip nativo a favor de uno a medida
                    overflowMethod: 'cap'
                }
            };

            timeline = new vis.Timeline(container, itemsDataSet, groupsDataSet, options);

            // Activar la lógica del Pop-up con "Ver más"
            setupCustomPopup();
        }

        // ============================
        // Lógica del Tooltip y "Ver más"
        // ============================
        function setupCustomPopup() {
            let hideTimeout;
            const tooltip = document.getElementById('timeline-tooltip');
            
            // Referencias del DOM
            const ttIcon = document.getElementById('tt-icon');
            const ttCategory = document.getElementById('tt-category');
            const ttFirstSentence = document.getElementById('tt-first-sentence');
            const ttFullText = document.getElementById('tt-full-text');
            const ttFuente = document.getElementById('tt-fuente');
            const ttPag = document.getElementById('tt-pag');
            const btnMore = document.getElementById('tt-btn-more');
            const fullContent = document.getElementById('tt-full-content');

            // Evento al situarse SOBRE la barra o punto
            timeline.on('itemover', function (props) {
                clearTimeout(hideTimeout);
                
                let item = itemsDataSet.get(props.item);
                if (!item || !item.customData) return;

                // Cargar los datos del elemento
                ttIcon.className = item.customData.icon;
                ttCategory.innerText = item.customData.category || "General";
                ttFirstSentence.innerText = item.customData.firstSentence;
                ttFullText.innerText = item.customData.fullText;
                ttFuente.innerText = item.customData.source || "S/D";
                ttPag.innerText = item.customData.page || "S/D";

                // Ocultar texto completo y mostrar botón
                fullContent.style.display = 'none';
                btnMore.style.display = 'flex';

                // Posicionamiento dinámico cerca del ratón
                const { pageX, pageY } = props.event;
                let topPos = pageY + 15;
                let leftPos = pageX + 15;
                
                tooltip.style.display = 'block'; 
                let ttRect = tooltip.getBoundingClientRect();
                
                // Evita que el tooltip se salga de la pantalla por la derecha
                if (leftPos + ttRect.width > window.innerWidth) {
                    leftPos = pageX - ttRect.width - 15;
                }
                
                tooltip.style.left = leftPos + 'px';
                tooltip.style.top = topPos + 'px';
            });

            // Evento al sacar el ratón de la barra o punto
            timeline.on('itemout', function (props) {
                // Da tiempo (300ms) para mover el ratón hacia el pop-up sin que desaparezca
                hideTimeout = setTimeout(() => {
                    tooltip.style.display = 'none';
                }, 300); 
            });

            // Mantiene el pop-up abierto si el cursor entra a este
            tooltip.addEventListener('mouseenter', () => {
                clearTimeout(hideTimeout);
            });

            // Se cierra cuando el cursor sale totalmente de la caja del pop-up
            tooltip.addEventListener('mouseleave', () => {
                tooltip.style.display = 'none';
            });

            // Expande hacia abajo el texto al presionar "Ver más"
            btnMore.addEventListener('click', () => {
                fullContent.style.display = 'block';
                btnMore.style.display = 'none';
            });
        }
    </script>
</body>
</html>
