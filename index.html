<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronología Histórica Interactiva</title>
    
    <!-- Fuentes modernas (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Estilos de Vis-Timeline -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* ============================
           Estética y Diseño Base
           ============================ */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            color: #2c3e50;
        }
        h1 {
            text-align: center;
            color: #1a252f;
            margin-bottom: 25px;
            font-weight: 700;
        }
        
        /* Contenedor de la línea de tiempo */
        #visualization {
            width: 100%;
            height: 85vh;
            border: 1px solid #e0e6ed;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* Eje de años y panel izquierdo */
        .vis-time-axis .vis-text {
            font-weight: 600;
            color: #34495e;
            font-size: 14px;
        }
        
        .vis-labelset .vis-label {
            /* Fija un tamaño base para que todas las localidades se vean uniformes */
            display: flex;
            align-items: center;
            padding: 0 15px !important;
            font-weight: 600;
            font-size: 14px;
            color: #2c3e50;
            border-bottom: 1px solid #f0f0f0;
            min-height: 50px;
        }

        /* Estilos personalizados para los puntos/barras de Vis-Timeline */
        .vis-item {
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            border-width: 2px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: white; 
        }
        .vis-item:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.2);
            z-index: 999 !important;
        }
        .vis-item-content {
            padding: 4px 8px;
            font-size: 16px;
        }

        /* Lógica para diferenciar Puntos vs Rangos temporalmente */
        .vis-item.vis-point { background-color: white !important; }
        .vis-item.vis-range { opacity: 0.9; }
        .vis-item.vis-range .vis-item-content { color: white !important; }

        /* ============================
           Pop-up (Tooltip Interactivo)
           ============================ */
        #timeline-tooltip {
            position: absolute;
            display: none;
            width: 320px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
            padding: 20px;
            z-index: 1000;
            border: 1px solid #eaeaea;
            font-size: 14px;
            pointer-events: auto;
        }
        .tt-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .tt-first-sentence {
            margin: 0 0 15px 0;
            line-height: 1.6;
            color: #444;
        }
        .btn-more {
            background-color: #34495e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }
        .btn-more:hover {
            background-color: #2c3e50;
        }
        .tt-full-content {
            display: none;
            margin-top: 15px;
            border-top: 1px dashed #dcdcdc;
            padding-top: 15px;
            animation: fadeIn 0.3s ease;
        }
        .tt-full-text {
            margin: 0 0 15px 0;
            line-height: 1.6;
            color: #555;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .tt-meta {
            font-size: 12px;
            color: #7f8c8d;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            line-height: 1.6;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #loader {
            text-align: center;
            padding: 60px;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>Cronología Histórica</h1>
    <div id="loader">Cargando datos desde CSV... <i class="fas fa-spinner fa-spin"></i></div>
    <div id="visualization" style="display:none;"></div>

    <!-- Contenedor del Pop-up -->
    <div id="timeline-tooltip">
        <div class="tt-header">
            <i id="tt-icon" class="fas fa-circle"></i>
            <span id="tt-category">Categoría</span>
        </div>
        <p class="tt-first-sentence" id="tt-first-sentence"></p>
        <button class="btn-more" id="tt-btn-more">Ver más <i class="fas fa-chevron-down"></i></button>
        
        <div class="tt-full-content" id="tt-full-content">
            <p class="tt-full-text" id="tt-full-text"></p>
            <div class="tt-meta">
                <div><strong>Fuente:</strong> <span id="tt-fuente"></span></div>
                <div><strong>Página:</strong> <span id="tt-pag"></span></div>
            </div>
        </div>
    </div>

    <!-- Librerías -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <script>
        const fileUrl = "CRONOLOGIAS FINAL.csv";

        // Mapeo estricto de Categorías (Columna D) a un Color y un Icono
        function getCategoryStyle(categoria) {
            const cat = (categoria || "").toLowerCase();
            
            if (cat.includes("transporte") || cat.includes("comunicacion")) {
                return { color: "#3498db", icon: "fas fa-train", title: "Transporte y Comunicaciones" }; // Azul
            }
            if (cat.includes("energía") || cat.includes("energia")) {
                return { color: "#f1c40f", icon: "fas fa-bolt", title: "Energía" }; // Amarillo
            }
            if (cat.includes("infraestructura") || cat.includes("institucion")) {
                return { color: "#9b59b6", icon: "fas fa-building", title: "Infraestructura e Instituciones" }; // Violeta
            }
            if (cat.includes("trabajo")) {
                return { color: "#e67e22", icon: "fas fa-hammer", title: "Trabajo" }; // Naranja
            }
            if (cat.includes("identidad") || cat.includes("celebración")) {
                return { color: "#e74c3c", icon: "fas fa-star", title: "Identidad y Celebración" }; // Rojo
            }
            
            // Default por si hay celdas vacías
            return { color: "#95a5a6", icon: "fas fa-calendar-check", title: "Histórico" }; // Gris
        }

        // Función para extraer solo la primera oración del texto
        function getFirstSentence(text) {
            if (!text) return "";
            let match = text.match(/(.*?[.!?])(?:\s|$)/);
            return match ? match[1] : text;
        }

        fetch(fileUrl)
            .then(response => {
                if (!response.ok) throw new Error("No se pudo cargar el archivo");
                return response.arrayBuffer();
            })
            .then(buffer => {
                let decoder = new TextDecoder('iso-8859-1'); 
                let csvText = decoder.decode(buffer);
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        document.getElementById('loader').style.display = 'none';
                        document.getElementById('visualization').style.display = 'block';
                        renderTimeline(results.data);
                    }
                });
            })
            .catch(err => {
                document.getElementById('loader').innerHTML = `<strong>Error:</strong> ${err.message}.`;
            });

        let timeline;
        let itemsDataSet;

        function renderTimeline(data) {
            let groups = [];
            let items = [];
            let localidades = new Set();

            data.forEach((row, index) => {
                let year = (row.Año || "").trim();
                let loc = (row.Localidad || "").trim();
                let desc = (row.Descripción || "").trim();
                let cat = (row.Categoría || "").trim();
                let fuente = (row.Fuente || "").trim();
                let pag = (row.Pag || "").trim();

                if (!year || !loc) return;

                // Panel Izquierdo (Eje Y: Localidades uniformes)
                if (!localidades.has(loc)) {
                    localidades.add(loc);
                    groups.push({
                        id: loc,
                        content: loc
                    });
                }

                // Determinamos estilos basados en la Categoría (Columna D)
                let styleData = getCategoryStyle(cat);
                
                let start, end = null, type = 'box';
                
                // Determinamos si es Rango o Punto
                if (year.includes('-')) {
                    let parts = year.split('-');
                    start = parts[0].trim() + '-01-01';
                    end = parts[1].trim() + '-12-31';
                    type = 'range'; 
                } else {
                    start = year + '-01-01';
                    type = 'point'; 
                }

                // Si es un periodo/rango, el fondo es de color. Si es un punto, el fondo es blanco y el borde es de color.
                let inlineStyle = type === 'range' 
                    ? `background-color: ${styleData.color}; border-color: ${styleData.color};` 
                    : `border-color: ${styleData.color}; color: ${styleData.color};`;

                items.push({
                    id: index,
                    group: loc,
                    start: start,
                    end: end,
                    type: type,
                    content: `<div class="vis-item-content"><i class="${styleData.icon}"></i></div>`,
                    style: inlineStyle,
                    customData: {
                        firstSentence: getFirstSentence(desc),
                        fullText: desc,
                        categoryTitle: styleData.title,
                        categoryColor: styleData.color,
                        icon: styleData.icon,
                        source: fuente,
                        page: pag
                    }
                });
            });

            itemsDataSet = new vis.DataSet(items);
            let groupsDataSet = new vis.DataSet(groups);

            let container = document.getElementById('visualization');
            
            // CONFIGURACIONES DE ZOOM Y LÍMITES SOLICITADOS
            let options = {
                zoomable: true,
                moveable: true,
                orientation: 'top', 
                stack: true,
                
                // Límites temporales: No se podrá navegar más allá de estas fechas
                min: new Date(1770, 0, 1),
                max: new Date(2027, 11, 31),
                
                // Límite de Zoom Hacia adentro: 1 Año (Evita que la "Fila A" muestre meses o días)
                zoomMin: 1000 * 60 * 60 * 24 * 365,
                
                // Fuerza a que la etiqueta temporal muestre únicamente Años
                format: {
                    minorLabels: { millisecond:'YYYY', second:'YYYY', minute:'YYYY', hour:'YYYY', weekday:'YYYY', day:'YYYY', month:'YYYY', year:'YYYY' }
                },

                margin: { item: 15, axis: 20 },
                tooltip: { followMouse: false, overflowMethod: 'cap' }
            };

            timeline = new vis.Timeline(container, itemsDataSet, groupsDataSet, options);
            setupCustomPopup();
        }

        // ============================
        // Lógica del Tooltip y Pop-up
        // ============================
        function setupCustomPopup() {
            let hideTimeout;
            const tooltip = document.getElementById('timeline-tooltip');
            
            const ttIcon = document.getElementById('tt-icon');
            const ttCategory = document.getElementById('tt-category');
            const ttFirstSentence = document.getElementById('tt-first-sentence');
            const ttFullText = document.getElementById('tt-full-text');
            const ttFuente = document.getElementById('tt-fuente');
            const ttPag = document.getElementById('tt-pag');
            const btnMore = document.getElementById('tt-btn-more');
            const fullContent = document.getElementById('tt-full-content');

            timeline.on('itemover', function (props) {
                clearTimeout(hideTimeout);
                
                let item = itemsDataSet.get(props.item);
                if (!item || !item.customData) return;

                // Inyectar datos e icono de la categoría
                ttIcon.className = item.customData.icon;
                ttIcon.style.color = item.customData.categoryColor;
                ttCategory.innerText = item.customData.categoryTitle;
                
                ttFirstSentence.innerText = item.customData.firstSentence;
                ttFullText.innerText = item.customData.fullText;
                ttFuente.innerText = item.customData.source || "S/D";
                ttPag.innerText = item.customData.page || "S/D";

                fullContent.style.display = 'none';
                btnMore.style.display = 'flex';
                btnMore.style.backgroundColor = item.customData.categoryColor;

                const { pageX, pageY } = props.event;
                let topPos = pageY + 15;
                let leftPos = pageX + 15;
                
                tooltip.style.display = 'block'; 
                let ttRect = tooltip.getBoundingClientRect();
                
                if (leftPos + ttRect.width > window.innerWidth) {
                    leftPos = pageX - ttRect.width - 15;
                }
                
                tooltip.style.left = leftPos + 'px';
                tooltip.style.top = topPos + 'px';
            });

            timeline.on('itemout', function (props) {
                hideTimeout = setTimeout(() => { tooltip.style.display = 'none'; }, 300); 
            });

            tooltip.addEventListener('mouseenter', () => clearTimeout(hideTimeout));
            tooltip.addEventListener('mouseleave', () => tooltip.style.display = 'none');

            btnMore.addEventListener('click', () => {
                fullContent.style.display = 'block';
                btnMore.style.display = 'none';
            });
        }
    </script>
</body>
</html>
