            <button class="btn-more" id="tooltipMore">Ver más</button>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    (function() {
        // ---- Colores ----
        const categoryColors = {
            'Huellas del transporte y las comunicaciones': '#3b82f6',
            'Huellas de la energía': '#f59e0b',
            'Huellas de la infraestructura y las  instituciones': '#10b981',
            'Huellas de la infraestructura y las instituciones': '#10b981',
            'Huellas del trabajo': '#ef4444',
            'Huellas de la identidad y la celebración': '#8b5cf6',
            'Huellas histórico-territoriales': '#f97316',
        };

        function getCategoryColor(cat) {
            const key = cat.trim();
            if (categoryColors[key]) return categoryColors[key];
            let hash = 0;
            for (let i = 0; i < key.length; i++) {
                hash = key.charCodeAt(i) + ((hash << 5) - hash);
            }
            return `hsl(${Math.abs(hash) % 360}, 70%, 55%)`;
        }

        // ---- DOM ----
        const fileInput = document.getElementById('fileInput');
        const visDiv = document.getElementById('vis');
        const tooltipDiv = document.getElementById('tooltip');
        const loadingMsg = document.getElementById('loadingMsg');
        const legendContainer = document.getElementById('legendContainer');
        const filterGroup = document.getElementById('filterGroup');
        const resetZoomBtn = document.getElementById('resetZoomBtn');

        // ---- Estado ----
        let allEvents = [];
        let activeCategories = new Set();
        let svgSelection = null;
        let zoomBehavior = null;
        let currentXScale = null;

        // ---- Tooltip ----
        let tooltipTimeout = null;
        let isTooltipHovered = false;
        let isEventHovered = false;

        const tooltipMore = document.getElementById('tooltipMore');
        const tooltipClose = document.getElementById('tooltipClose');
        const firstSentenceEl = tooltipDiv.querySelector('.first-sentence');
        const fullTextEl = document.getElementById('tooltipFull').querySelector('.full-text');
        const sourceEl = document.getElementById('tooltipSource');
        const pageEl = document.getElementById('tooltipPage');
        const linkEl = document.getElementById('tooltipLink');
        const fullDiv = document.getElementById('tooltipFull');

        function showTooltip(clientX, clientY, first, full, source, page, url) {
            clearTimeout(tooltipTimeout);
            firstSentenceEl.textContent = first || '(sin descripción)';
            fullTextEl.textContent = full || '';
            sourceEl.textContent = source || '—';
            pageEl.textContent = page || '—';
            if (url && url.startsWith('http')) {
                linkEl.innerHTML = `<a href="${url}" target="_blank">${url}</a>`;
            } else {
                linkEl.textContent = url || '—';
            }
            fullDiv.classList.remove('show');
            tooltipMore.textContent = 'Ver más';
            tooltipDiv.classList.remove('expanded');

            let left = clientX + 14;
            let top = clientY - 10;
            const tw = Math.min(380, window.innerWidth - 30);
            const th = Math.min(400, window.innerHeight - 30);
            if (left + tw > window.innerWidth - 10) left = clientX - tw - 14;
            if (top + th > window.innerHeight - 10) top = window.innerHeight - th - 10;
            if (top < 10) top = 10;
            tooltipDiv.style.left = left + 'px';
            tooltipDiv.style.top = top + 'px';
            tooltipDiv.style.display = 'block';
            tooltipDiv.dataset.open = 'true';
        }

        function hideTooltip(delayed = true) {
            if (delayed) {
                clearTimeout(tooltipTimeout);
                tooltipTimeout = setTimeout(() => {
                    if (!isTooltipHovered && !isEventHovered) {
                        tooltipDiv.style.display = 'none';
                        tooltipDiv.dataset.open = 'false';
                        fullDiv.classList.remove('show');
                        tooltipDiv.classList.remove('expanded');
                        tooltipMore.textContent = 'Ver más';
                    }
                }, 150);
            } else {
                clearTimeout(tooltipTimeout);
                tooltipDiv.style.display = 'none';
                tooltipDiv.dataset.open = 'false';
                fullDiv.classList.remove('show');
                tooltipDiv.classList.remove('expanded');
                tooltipMore.textContent = 'Ver más';
            }
        }

        tooltipDiv.addEventListener('mouseenter', () => {
            isTooltipHovered = true;
            clearTimeout(tooltipTimeout);
        });
        tooltipDiv.addEventListener('mouseleave', () => {
            isTooltipHovered = false;
            if (!isEventHovered) {
                hideTooltip(true);
            }
        });

        tooltipMore.addEventListener('click', function(e) {
            e.stopPropagation();
            const isExpanded = tooltipDiv.classList.contains('expanded');
            if (!isExpanded) {
                fullDiv.classList.add('show');
                tooltipDiv.classList.add('expanded');
                tooltipMore.textContent = 'Ver menos';
                const tw = Math.min(380, window.innerWidth - 30);
                const th = Math.min(400, window.innerHeight - 30);
                let left = parseFloat(tooltipDiv.style.left);
                let top = parseFloat(tooltipDiv.style.top);
                if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
                if (top + th > window.innerHeight - 10) top = window.innerHeight - th - 10;
                if (top < 10) top = 10;
                tooltipDiv.style.left = left + 'px';
                tooltipDiv.style.top = top + 'px';
            } else {
                fullDiv.classList.remove('show');
                tooltipDiv.classList.remove('expanded');
                tooltipMore.textContent = 'Ver más';
            }
        });

        tooltipClose.addEventListener('click', function() {
            hideTooltip(false);
        });

        document.addEventListener('click', function(e) {
            if (tooltipDiv.dataset.open === 'true') {
                const target = e.target;
                if (!tooltipDiv.contains(target) && !target.closest('.event-group')) {
                    hideTooltip(false);
                }
            }
        });

        // ---- Utilidades ----
        function firstSentence(text) {
            if (!text) return '';
            const idx = text.search(/\.\s+/);
            if (idx !== -1) return text.substring(0, idx + 1).trim();
            return text.trim();
        }

        function restText(text) {
            if (!text) return '';
            const idx = text.search(/\.\s+/);
            if (idx !== -1) return text.substring(idx + 1).trim();
            return '';
        }

        // ---- Parseo Excel ----
        function parseEventsFromSheet(sheet) {
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            if (rows.length < 2) return [];
            const header = rows[0];
            const getIndex = (name) => {
                const idx = header.findIndex(cell => cell && cell.toString().trim() === name);
                return idx !== -1 ? idx : null;
            };
            const idxYear = getIndex('Año') ?? 0;
            const idxLoc = getIndex('Localidad') ?? 1;
            const idxDesc = getIndex('Descripción') ?? 2;
            const idxCat = getIndex('Categoría') ?? 3;
            const idxSource = getIndex('Fuente') ?? 4;
            const idxPage = getIndex('Pag') ?? 5;
            const idxUrl = getIndex('G') ?? 6;

            const events = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                const yearRaw = row[idxYear] ? row[idxYear].toString().trim() : '';
                const localidad = row[idxLoc] ? row[idxLoc].toString().trim() : '';
                const desc = row[idxDesc] ? row[idxDesc].toString().trim() : '';
                const cat = row[idxCat] ? row[idxCat].toString().trim() : '';
                const fuente = row[idxSource] ? row[idxSource].toString().trim() : '';
                const pagina = row[idxPage] ? row[idxPage].toString().trim() : '';
                const url = row[idxUrl] ? row[idxUrl].toString().trim() : '';
                if (!yearRaw || !localidad) continue;
                let start, end;
                if (yearRaw.includes('-')) {
                    const parts = yearRaw.split('-').map(s => s.trim());
                    const s = parseInt(parts[0]);
                    const e = parseInt(parts[1]);
                    if (!isNaN(s) && !isNaN(e)) { start = Math.min(s, e);
                        end = Math.max(s, e); } else continue;
                } else {
                    const num = parseInt(yearRaw);
                    if (!isNaN(num)) { start = num;
                        end = num; } else continue;
                }
                if (start < 1000 || end > 2100) continue;
                const categoria = cat || 'Sin categoría';
                events.push({ start, end, localidad, desc, categoria, fuente, pagina, url });
            }
            return events;
        }

        // ---- Render principal ----
        function render(events, activeCats) {
            if (!events || events.length === 0) {
                visDiv.innerHTML = '<div class="loading">No hay eventos para mostrar.</div>';
                legendContainer.innerHTML = '';
                filterGroup.innerHTML = '';
                return;
            }

            let filtered = events;
            if (activeCats && activeCats.size > 0) {
                filtered = events.filter(e => activeCats.has(e.categoria));
            }
            if (filtered.length === 0) {
                visDiv.innerHTML = '<div class="loading">No hay eventos con las categorías seleccionadas.</div>';
                legendContainer.innerHTML = '';
                return;
            }

            const localidades = [...new Set(filtered.map(e => e.localidad))].sort((a, b) => a.localeCompare(b));
            const minYear = Math.min(...filtered.map(e => e.start));
            const maxYear = Math.max(...filtered.map(e => e.end));
            const yearPadding = 2;
            const xMin = minYear - yearPadding;
            const xMax = maxYear + yearPadding;

            const margin = { top: 40, right: 60, bottom: 60, left: 130 };
            const width = Math.max(800, visDiv.clientWidth - 20);
            const rowHeight = 44;
            const height = Math.max(400, localidades.length * rowHeight + margin.top + margin.bottom);

            visDiv.innerHTML = '';
            const svg = d3.select(visDiv)
                .append('svg')
                .attr('width', width)
                .attr('height', height)
                .style('overflow', 'visible');

            const clipId = 'clip-' + Date.now();
            svg.append('defs')
                .append('clipPath')
                .attr('id', clipId)
                .append('rect')
                .attr('x', margin.left)
                .attr('y', margin.top)
                .attr('width', width - margin.left - margin.right)
                .attr('height', height - margin.top - margin.bottom);

            const chartGroup = svg.append('g')
                .attr('class', 'chart-group')
                .attr('clip-path', `url(#${clipId})`);

            chartGroup.append('rect')
                .attr('x', margin.left)
                .attr('y', margin.top)
                .attr('width', width - margin.left - margin.right)
                .attr('height', height - margin.top - margin.bottom)
                .attr('fill', 'white')
                .attr('stroke', '#e2e8f0')
                .attr('stroke-width', 0.5);

            const xScale = d3.scaleLinear()
                .domain([xMin, xMax])
                .range([margin.left, width - margin.right]);

            const yScale = d3.scaleBand()
                .domain(localidades)
                .range([margin.top, height - margin.bottom])
                .padding(0.5);

            const bandWidth = yScale.bandwidth();

            // Líneas separadoras horizontales
            localidades.forEach(loc => {
                const yPos = yScale(loc) + bandWidth;
                chartGroup.append('line')
                    .attr('x1', margin.left)
                    .attr('x2', width - margin.right)
                    .attr('y1', yPos)
                    .attr('y2', yPos)
                    .attr('stroke', '#e9edf2')
                    .attr('stroke-width', 1)
                    .attr('stroke-dasharray', '4,4');
            });

            const xAxis = d3.axisBottom(xScale)
                .tickFormat(d3.format('d'))
                .ticks(Math.min(20, (maxYear - minYear) / 2));

            const xAxisG = svg.append('g')
                .attr('class', 'x-axis')
                .attr('transform', `translate(0, ${height - margin.bottom})`)
                .call(xAxis)
                .style('font-size', '11px')
                .style('color', '#475569');

            const yAxis = d3.axisLeft(yScale)
                .tickSize(0);

            const yAxisG = svg.append('g')
                .attr('class', 'y-axis')
                .attr('transform', `translate(${margin.left - 6}, 0)`)
                .call(yAxis)
                .style('font-size', '12px')
                .style('font-weight', '500')
                .style('color', '#1e293b');

            const eventsByLoc = d3.group(filtered, d => d.localidad);
            const orderedEventsByLoc = new Map();
            localidades.forEach(loc => {
                const evs = eventsByLoc.get(loc) || [];
                evs.sort((a, b) => a.start - b.start || a.end - b.end);
                orderedEventsByLoc.set(loc, evs);
            });

            function drawEvents(scaleX) {
                chartGroup.selectAll('.event-group').remove();

                localidades.forEach(loc => {
                    const locEvents = orderedEventsByLoc.get(loc) || [];
                    const yBase = yScale(loc);
                    const bandH = bandWidth;

                    locEvents.forEach((event, idx) => {
                        const x1 = scaleX(event.start);
                        const x2 = scaleX(event.end);
                        const color = getCategoryColor(event.categoria);

                        const offset = (idx % 2 === 0) ? bandH * 0.25 : bandH * 0.75;
                        const yPos = yBase + offset;

                        const group = chartGroup.append('g')
                            .attr('class', 'event-group')
                            .attr('data-start', event.start)
                            .attr('data-end', event.end)
                            .attr('data-localidad', event.localidad)
                            .attr('data-desc', event.desc)
                            .attr('data-cat', event.categoria)
                            .attr('data-fuente', event.fuente)
                            .attr('data-pagina', event.pagina)
                            .attr('data-url', event.url);

                        if (event.start === event.end) {
                            const radius = Math.min(5, bandH * 0.16);
                            group.append('circle')
                                .attr('cx', x1)
                                .attr('cy', yPos)
                                .attr('r', radius)
                                .attr('fill', color)
                                .attr('stroke', '#1e293b')
                                .attr('stroke-width', 0.8)
                                .style('cursor', 'pointer')
                                .style('opacity', 0.9);
                        } else {
                            const barHeight = Math.max(2.5, bandH * 0.14);
                            group.append('rect')
                                .attr('x', x1)
                                .attr('y', yPos - barHeight / 2)
                                .attr('width', Math.max(2, x2 - x1))
                                .attr('height', barHeight)
                                .attr('fill', color)
                                .attr('stroke', '#1e293b')
                                .attr('stroke-width', 0.8)
                                .style('cursor', 'pointer')
                                .style('opacity', 0.9);
                        }

                        group.on('mouseenter', function(ev) {
                            const el = this;
                            isEventHovered = true;
                            clearTimeout(tooltipTimeout);
                            const first = firstSentence(el.getAttribute('data-desc'));
                            const full = restText(el.getAttribute('data-desc'));
                            const fuente = el.getAttribute('data-fuente');
                            const pagina = el.getAttribute('data-pagina');
                            const url = el.getAttribute('data-url');
                            showTooltip(ev.clientX, ev.clientY, first, full, fuente, pagina, url);
                        })
                        .on('mousemove', function(ev) {
                            if (tooltipDiv.dataset.open === 'true') {
                                let left = ev.clientX + 14;
                                let top = ev.clientY - 10;
                                const tw = Math.min(380, window.innerWidth - 30);
                                const th = Math.min(400, window.innerHeight - 30);
                                if (left + tw > window.innerWidth - 10) left = ev.clientX - tw - 14;
                                if (top + th > window.innerHeight - 10) top = window.innerHeight - th - 10;
                                if (top < 10) top = 10;
                                tooltipDiv.style.left = left + 'px';
                                tooltipDiv.style.top = top + 'px';
                            }
                        })
                        .on('mouseleave', function() {
                            isEventHovered = false;
                            if (!isTooltipHovered) {
                                hideTooltip(true);
                            }
                        });
                    });
                });
            }

            drawEvents(xScale);

            const zoom = d3.zoom()
                .scaleExtent([0.5, 50])
                .on('zoom', function(zoomEvent) {
                    const transform = zoomEvent.transform;
                    const newXScale = transform.rescaleX(xScale);
                    currentXScale = newXScale;
                    xAxisG.call(xAxis.scale(newXScale));
                    drawEvents(newXScale);
                });

            svg.call(zoom);
            svgSelection = svg;
            zoomBehavior = zoom;
            currentXScale = xScale;

            // Leyenda
            const cats = [...new Set(filtered.map(e => e.categoria))];
            legendContainer.innerHTML = cats.map(cat => {
                const color = getCategoryColor(cat);
                return `<div class="legend-item">
                            <span class="legend-color" style="background:${color}"></span>
                            ${cat}
                        </div>`;
            }).join('');

            // Filtros
            const allCats = [...new Set(events.map(e => e.categoria))];
            const allChecked = allCats.every(cat => activeCats.has(cat));

            let filterHtml = `<label class="filter-all" title="Activar/desactivar todas las categorías">
                                <input type="checkbox" id="selectAllCats" ${allChecked ? 'checked' : ''} />
                                <span>✅ Todas</span>
                             </label>`;

            filterHtml += allCats.map(cat => {
                const color = getCategoryColor(cat);
                const checked = activeCats.has(cat) ? 'checked' : '';
                return `<label class="filter-item">
                            <input type="checkbox" value="${cat}" ${checked} />
                            <span class="color-dot" style="background:${color}"></span>
                            ${cat}
                        </label>`;
            }).join('');

            filterGroup.innerHTML = filterHtml;

            const selectAllCb = document.getElementById('selectAllCats');
            const allCheckboxes = filterGroup.querySelectorAll('input[type="checkbox"]:not(#selectAllCats)');

            function updateSelectAllState() {
                const checkedCount = Array.from(allCheckboxes).filter(cb => cb.checked).length;
                if (selectAllCb) {
                    selectAllCb.checked = (checkedCount === allCheckboxes.length);
                }
            }

            if (selectAllCb) {
                selectAllCb.addEventListener('change', function() {
                    const checked = this.checked;
                    allCheckboxes.forEach(cb => {
                        cb.checked = checked;
                        const cat = cb.value;
                        if (checked) {
                            activeCategories.add(cat);
                        } else {
                            activeCategories.delete(cat);
                        }
                    });
                    if (!checked) {
                        activeCategories = new Set(allCats);
                        allCheckboxes.forEach(cb => {
                            cb.checked = true;
                        });
                        selectAllCb.checked = true;
                    }
                    render(allEvents, activeCategories);
                });
            }

            allCheckboxes.forEach(cb => {
                cb.addEventListener('change', function() {
                    const cat = this.value;
                    if (this.checked) {
                        activeCategories.add(cat);
                    } else {
                        activeCategories.delete(cat);
                    }
                    updateSelectAllState();
                    if (activeCategories.size === 0) {
                        activeCategories = new Set(allCats);
                        allCheckboxes.forEach(c => c.checked = true);
                        if (selectAllCb) selectAllCb.checked = true;
                    }
                    render(allEvents, activeCategories);
                });
            });

            updateSelectAllState();
            svg.attr('height', height);
        }

        // ---- Carga desde archivo (fetch o input) ----
        function loadFromArrayBuffer(arrayBuffer) {
            try {
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                let sheetName = 'Cronologica de detalle';
                let sheet = workbook.Sheets[sheetName];
                if (!sheet) {
                    sheetName = workbook.SheetNames[0];
                    sheet = workbook.Sheets[sheetName];
                }
                if (!sheet) {
                    visDiv.innerHTML = '<div class="loading">No se encontraron hojas en el archivo.</div>';
                    return;
                }
                const events = parseEventsFromSheet(sheet);
                if (events.length === 0) {
                    visDiv.innerHTML = '<div class="loading">No se pudieron extraer eventos válidos.</div>';
                    legendContainer.innerHTML = '';
                    filterGroup.innerHTML = '';
                    return;
                }
                allEvents = events;
                activeCategories = new Set(events.map(e => e.categoria));
                render(events, activeCategories);
                // Ocultar mensaje de carga
                loadingMsg.textContent = '';
            } catch (err) {
                console.error(err);
                visDiv.innerHTML = `<div class="loading">Error al leer el archivo: ${err.message}</div>`;
            }
        }

        // ---- Carga automática desde el mismo directorio ----
        function loadDefaultFile() {
            const url = 'CRONOLOGIAS FINAL.xlsx';
            loadingMsg.textContent = 'Cargando archivo automáticamente...';
            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.arrayBuffer();
                })
                .then(arrayBuffer => {
                    loadFromArrayBuffer(arrayBuffer);
                })
                .catch(err => {
                    console.warn('No se pudo cargar el archivo por defecto:', err);
                    loadingMsg.innerHTML = 'No se encontró el archivo "CRONOLOGIAS FINAL.xlsx" en el mismo directorio. Por favor, cárguelo manualmente.';
                });
        }

        // ---- Evento input file ----
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                loadFromArrayBuffer(loadEvent.target.result);
            };
            reader.readAsArrayBuffer(file);
        });

        // ---- Reset zoom ----
        resetZoomBtn.addEventListener('click', function() {
            if (svgSelection && zoomBehavior) {
                svgSelection.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
            }
        });

        // ---- Inicial ----
        loadDefaultFile();

        window.addEventListener('resize', function() {
            if (allEvents.length) {
                render(allEvents, activeCategories);
            }
        });

    })();
</script>

</body>
</html>
